<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>BrainBot Einsatzbericht v1.0.4</title>
    <style>
        :root {
            --primary: #007bff;
            --success: #28a745;
            --purple: #6f42c1;
            --dark: #2c3e50;
            --light: #f8f9fa;
            --border: #dee2e6;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #e9ecef;
            color: #333;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        h1 {
            margin-top: 0;
            color: var(--dark);
            font-size: 2.2rem;
        }

        .status-banner {
            background: #fff3cd;
            color: #856404;
            padding: 15px;
            margin-bottom: 30px;
            border-radius: 10px;
            font-weight: 600;
            border-left: 5px solid #ffc107;
        }

        .dashboard-header {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
            background: var(--light);
            padding: 25px;
            border-radius: 15px;
            border: 1px solid var(--border);
            margin-bottom: 30px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--dark);
        }

        select, input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .map-wrapper {
            position: relative;
            width: 680px;
            margin: 50px auto;
            background: #fff;
            padding: 20px 20px 40px 60px;
            border-radius: 15px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.05);
        }

        .y-axis {
            position: absolute;
            left: 15px;
            top: 20px;
            height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-end;
            font-weight: bold;
            color: #7f8c8d;
            font-size: 13px;
        }

        .x-axis {
            position: absolute;
            left: 60px;
            bottom: 10px;
            width: 600px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            color: #7f8c8d;
            font-size: 13px;
        }

        #mapContainer {
            width: 600px;
            height: 400px;
            border: 3px solid var(--dark);
            background: #ffffff;
            background-image: linear-gradient(#f0f0f0 2px, transparent 2px), linear-gradient(90deg, #f0f0f0 2px, transparent 2px);
            background-size: 30px 30px;
            position: relative;
            border-radius: 4px;
        }

        .point {
            position: absolute;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid white;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
            z-index: 5;
        }

        .table-container {
            margin-top: 40px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: var(--dark);
            color: white;
            padding: 18px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid var(--border);
            background: white;
        }

        button {
            padding: 14px 28px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-update {
            background: var(--primary);
            color: white;
        }

        .btn-export {
            background: var(--success);
            color: white;
        }

        .ai-box {
            background: #f3f0ff;
            border: 2px dashed #6f42c1;
            padding: 25px;
            border-radius: 15px;
            margin-top: 40px;
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🤖 BrainBot Einsatzbericht <small style="opacity: 0.5;">v1.0.4</small></h1>

        <div class="status-banner">
            📍 Status: System bereit. Bitte Raum aus dem Dropdown wählen.
        </div>

        <div class="dashboard-header">
            <div class="input-group">
                <label>Aktiver Raum / Projektname:</label>
                <div style="display: flex; gap: 10px;">
                    <select id="roomName" onchange="fetchHistory()">
                        <option value="">-- Alle Daten laden --</option>
                    </select>
                    <button class="btn-update" onclick="loadRooms()">🔄 Liste</button>
                </div>
            </div>
            <div class="input-group">
                <label>Zeitfilter:</label>
                <select id="timeFilter" onchange="fetchHistory()">
                    <option value="all">Alle Daten</option>
                    <option value="day">Letzte 24h</option>
                </select>
            </div>
        </div>

        <div class="map-wrapper">
            <div class="y-axis"><span>1000</span><span>750</span><span>500</span><span>250</span><span>0 (Y)</span></div>
            <div id="mapContainer"><div id="pathDisplay"></div></div>
            <div class="x-axis"><span>0 (X)</span><span>250</span><span>500</span><span>750</span><span>1000</span></div>
        </div>

        <div style="display: flex; justify-content: center; gap: 20px; margin: 30px 0;">
            <button class="btn-update" onclick="fetchHistory()">🔄 Bericht aktualisieren</button>
            <button class="btn-export" onclick="triggerJpgExport()">📸 Bericht speichern (JPG)</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Zeit</th>
                        <th>Quelle</th>
                        <th>Position (X|Y)</th>
                        <th>Distanz</th>
                        <th>Kategorie</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <div class="ai-box">
            <strong>KI-Analyse:</strong>
            <input id="predictCommand" placeholder="Befehl" style="width: 150px;">
            <input id="predictDistance" type="number" value="60" style="width: 100px;">
            <button class="btn-update" style="background:#6f42c1;" onclick="doPrediction()">Analyse starten</button>
            <span id="predictResult" style="font-weight: bold; color: #6f42c1;">-</span>
        </div>
    </div>

    <script>
        // Funktion 1: Lädt die Raumliste für das Dropdown
        async function loadRooms() {
            try {
                const res = await fetch('/api/webcontrol/rooms');
                const rooms = await res.json();
                const select = document.getElementById('roomName');
                const currentVal = select.value;

                select.innerHTML = '<option value="">-- Alle Daten laden --</option>';
                rooms.forEach(room => {
                    const opt = document.createElement('option');
                    opt.value = room;
                    opt.innerText = room;
                    if (room === currentVal) opt.selected = true;
                    select.appendChild(opt);
                });
            } catch (e) { console.error("Fehler beim Laden der Räume:", e); }
        }

        // Funktion 2: Lädt die Verlaufsdaten (Karte + Tabelle)
        async function fetchHistory() {
            try {
                const room = document.getElementById('roomName').value;
                const res = await fetch(`/api/webcontrol/history?room=${encodeURIComponent(room)}`);
                const data = await res.json();

                const container = document.getElementById('pathDisplay');
                const table = document.getElementById('tableBody');
                container.innerHTML = "";
                table.innerHTML = "";

                data.forEach(item => {
                    // Farblogik
                    let color = "#3498db";
                    const cat = (item.category || item.Category || "").toLowerCase();
                    if (cat.includes("angelegt") || cat.includes("start")) color = "#2ecc71";
                    if (cat.includes("hindernis") || cat.includes("stopp")) color = "#e74c3c";

                    // Punkt auf Karte
                    const dot = document.createElement('div');
                    dot.className = 'point';
                    dot.style.backgroundColor = color;
                    let x = (Math.max(0, Math.min(1000, item.posX || item.PosX)) / 1000) * 600;
                    let y = 400 - (Math.max(0, Math.min(1000, item.posY || item.PosY)) / 1000) * 400;
                    dot.style.left = x + "px";
                    dot.style.top = y + "px";
                    container.appendChild(dot);

                    // Tabellenzeile (Fix für Groß-/Kleinschreibung)
                    table.innerHTML += `<tr>
                            <td>${item.zeitpunkt || item.Zeitpunkt || '-'}</td>
                            <td>${item.quelle || item.Quelle || 'System'}</td>
                            <td><strong>${item.posX || item.PosX} | ${item.posY || item.PosY}</strong></td>
                            <td>${item.distanz || item.Distanz || '0'}</td>
                            <td style="color:${color}; font-weight:bold;">${item.category || item.Category}</td>
                        </tr>`;
                });
            } catch (e) { console.error("Fehler beim Laden der History:", e); }
        }

        function doPrediction() {
            const cmd = document.getElementById('predictCommand').value;
            const dist = document.getElementById('predictDistance').value;
            fetch('/api/webcontrol/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ Command: cmd, Distance: parseInt(dist) })
            })
                .then(r => r.json())
                .then(data => document.getElementById('predictResult').innerText = data.prediction);
        }

        async function triggerJpgExport() {
            const room = document.getElementById('roomName').value;
            const res = await fetch('/api/webcontrol/export', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ RoomName: room })
            });
            const data = await res.json();
            if (data.Ok) window.open(data.DownloadUrl, '_blank');
        }

        // Start-Sequenz
        window.onload = async () => {
            await loadRooms();
            await fetchHistory();
        };
    </script>
</body>
</html>
